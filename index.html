
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncLane | Professional Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--primary)',
              theme: {
                page: 'var(--bg-page)',
                surface: 'var(--bg-surface)',
                border: 'var(--border-base)',
                text: 'var(--text-main)',
                muted: 'var(--text-muted)',
              }
            },
            borderRadius: {
              '3xl': '1.5rem',
              '4xl': '2rem',
            },
            boxShadow: {
              'pro': '0 1px 2px rgba(0,0,0,0.05), 0 4px 6px -1px rgba(0,0,0,0.01), 0 10px 15px -3px rgba(0,0,0,0.01)',
              'pro-hover': '0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04)',
            }
          }
        }
      }
    </script>
    <style>
        /* Base / Default (Emerald) */
        :root {
          --primary: #10b981;
          --primary-rgb: 16, 185, 129;
          --bg-page: #ffffff;
          --bg-surface: #f8fafc;
          --border-base: #f1f5f9;
          --text-main: #0f172a;
          --text-muted: #64748b;
        }

        .dark:root {
          --bg-page: #09090b;
          --bg-surface: #18181b;
          --border-base: rgba(255,255,255,0.05);
          --text-main: #fafafa;
          --text-muted: #a1a1aa;
        }

        /* Cobalt (Midnight) */
        .theme-cobalt {
          --primary: #3b82f6;
          --primary-rgb: 59, 130, 246;
          --bg-page: #f8faff;
          --bg-surface: #f1f5ff;
          --border-base: #e2e8f0;
          --text-main: #1e293b;
          --text-muted: #64748b;
        }
        .dark.theme-cobalt {
          --bg-page: #020617;
          --bg-surface: #0f172a;
          --border-base: rgba(59,130,246,0.1);
          --text-main: #f1f5f9;
          --text-muted: #94a3b8;
        }

        /* Solar (Paper/Light) */
        .theme-amber {
          --primary: #d97706;
          --primary-rgb: 217, 119, 6;
          --bg-page: #fdf6e3;
          --bg-surface: #eee8d5;
          --border-base: #93a1a144;
          --text-main: #073642;
          --text-muted: #586e75;
        }
        .dark.theme-amber {
          --bg-page: #002b36;
          --bg-surface: #073642;
          --border-base: #586e7544;
          --text-main: #93a1a1;
          --text-muted: #839496;
        }

        /* Amethyst (Creative) */
        .theme-amethyst {
          --primary: #a855f7;
          --primary-rgb: 168, 85, 247;
          --bg-page: #fdfaff;
          --bg-surface: #f5f1ff;
          --border-base: #e2e8f0;
          --text-main: #1e1b4b;
          --text-muted: #6366f1;
        }
        .dark.theme-amethyst {
          --bg-page: #0f071a;
          --bg-surface: #1a0b2e;
          --border-base: rgba(168,85,247,0.1);
          --text-main: #f5f3ff;
          --text-muted: #a78bfa;
        }

        /* Rose (High Energy) */
        .theme-rose {
          --primary: #f43f5e;
          --primary-rgb: 244, 63, 94;
          --bg-page: #fffafb;
          --bg-surface: #fff1f2;
          --border-base: #fecdd3;
          --text-main: #881337;
          --text-muted: #fb7185;
        }
        .dark.theme-rose {
          --bg-page: #0f0a0a;
          --bg-surface: #1a0f0f;
          --border-base: rgba(244,63,94,0.1);
          --text-main: #fff1f2;
          --text-muted: #fda4af;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            letter-spacing: -0.011em;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-base);
            border-radius: 10px;
        }

        .kanban-snap-container {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .kanban-snap-column {
            scroll-snap-align: center;
        }

        .no-select { user-select: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }

        .drawer-mask {
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="transition-colors duration-300 antialiased overflow-x-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
